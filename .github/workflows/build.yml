name: Build A960D Fast
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Clone kernel
        run: |
          rm -rf kernel
          git clone https://github.com/nasreirma/spreadtrum-sc7731-android-5.1-mocordroid-source.git --depth=1 kernel
          ls kernel | head -n 20
          find kernel -maxdepth 4 -type d -name configs | head -n 5
      - name: Install
        run: sudo apt update -y && sudo apt install -y bc bison flex gcc-arm-linux-gnueabihf libssl-dev
      - name: Build
        run: |
          if [ -d "kernel/kernel/arch/arm/configs" ]; then CDIR="kernel/kernel"; else CDIR="kernel"; fi
          echo "CDIR=$CDIR"
          ls $CDIR/arch/arm/configs/ | grep 7731 || ls $CDIR/arch/arm/configs/ | head
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          cd $CDIR
          DEF=$(ls arch/arm/configs/ | grep 7731 | head -n 1)
          if [ -z "$DEF" ]; then DEF=$(ls arch/arm/configs/ | head -n 1); fi
          echo "Using $DEF"
          make $DEF
          printf "\nCONFIG_ANDROID_BINDERFS=y\nCONFIG_SECCOMP=y\nCONFIG_SECCOMP_FILTER=y\n" >> .config
          make olddefconfig
          make -j$(nproc) zImage
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: zImage-A960D
          path: "**/zImage"
