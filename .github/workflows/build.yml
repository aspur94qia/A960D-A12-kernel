name: Build A960D Fast
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
    steps:
      - name: Install deps
        run: |
          apt update -y
          apt install -y git bc bison flex gcc-arm-linux-gnueabihf libssl-dev make
          git config --global --add safe.directory $GITHUB_WORKSPACE
      - uses: actions/checkout@v4
      - name: Clone + patches
        run: |
          rm -rf kernel
          git clone https://github.com/Linux4/samsung_kernel.git --depth=1 kernel
          mkdir -p kernel/toolchain/clang/host/linux-x86/clang-4639204-cfp-jopp/bin
          printf '#!/bin/bash\nREAL=/usr/bin/arm-linux-gnueabihf-gcc\nARGS=();SKIP=0; for a in "$@";do [ $SKIP -eq 1 ]&&{SKIP=0;continue;};case "$a" in -march=armv8-a+lse|-march=armv8-a)continue;; -Xassembler)SKIP=1;continue;; -no-integrated-as)continue;; --param=allow-store-data-races=0)continue;; esac; [[ "$a" == *.d ]]&&{ p=$(echo "$a"|rev|cut -d, -f1|rev);mkdir -p "$(dirname "$p")" 2>/dev/null;touch "$p" 2>/dev/null;}; ARGS+=("$a"); done; exec $REAL "${ARGS[@]}"\n' > kernel/toolchain/clang/host/linux-x86/clang-4639204-cfp-jopp/bin/clang
          chmod +x kernel/toolchain/clang/host/linux-x86/clang-4639204-cfp-jopp/bin/clang
          cd kernel
          # ONLY inject dev_socdata definition - no function delete
          sed -i '1i #define DEV_SOCDATA_MAGIC 0x534F4344\nstruct dev_socdata { int magic; const char *soc; const char *ip; };' include/linux/device.h
          sed -i '1i #define dbg_snapshot_spinlock(l,c) do{}while(0)' include/linux/spinlock_api_smp.h
      - name: Build
        run: |
          export ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- CC=arm-linux-gnueabihf-gcc HOSTCC="gcc -fcommon"
          cd kernel
          DEF=$(ls arch/arm/configs/ | tail -n 1); make $DEF
          sed -i 's/CONFIG_DEBUG_SNAPSHOT=.*/# CONFIG_DEBUG_SNAPSHOT is not set/' .config; echo "# CONFIG_DEBUG_SNAPSHOT is not set" >>.config
          echo "CONFIG_ANDROID_BINDERFS=y" >>.config; echo "CONFIG_SECCOMP=y" >>.config
          make olddefconfig
          make -j1 scripts_basic; printf '#!/bin/sh\nmkdir -p "$(dirname "$1")"; touch "$1"; exit 0\n' > scripts/basic/fixdep; chmod +x scripts/basic/fixdep
          make -j1 scripts; make -j1 prepare KCFLAGS="-Wno-error"
          make -j$(nproc) zImage KCFLAGS="-Wno-error" || make -j1 zImage KCFLAGS="-Wno-error"
          ls -lh arch/arm/boot/zImage
      - uses: actions/upload-artifact@v4
        with:
          name: zImage-A960D
          path: kernel/arch/arm/boot/zImage
