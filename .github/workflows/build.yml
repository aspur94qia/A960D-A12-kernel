name: Build A960D Fast
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
    steps:
      - name: Install deps
        run: |
          apt update -y
          apt install -y git bc bison flex gcc-arm-linux-gnueabihf libssl-dev make
          git config --global --add safe.directory $GITHUB_WORKSPACE
          REAL=$(which arm-linux-gnueabihf-gcc)
          echo $REAL
          mv $REAL ${REAL}.real
          cat > $REAL << 'WRAP'
          #!/bin/bash
          REAL_BIN="${0}.real"
          for arg in "$@"; do
            if echo "$arg" | grep -q "\.d"; then
              # try extract path after last comma
              p=$(echo "$arg" | rev | cut -d, -f1 | rev)
              if echo "$p" | grep -q "\.d$"; then
                mkdir -p "$(dirname "$p")" 2>/dev/null || true
                touch "$p" 2>/dev/null || true
              fi
            fi
          done
          exec "$REAL_BIN" "$@"
          WRAP
          chmod +x $REAL
          cat $REAL
          ls -l $REAL*
      - uses: actions/checkout@v4
      - name: Clone
        run: |
          rm -rf kernel
          git clone https://github.com/Linux4/samsung_kernel.git --depth=1 kernel
          mkdir -p kernel/toolchain/clang/host/linux-x86/clang-4639204-cfp-jopp/bin
          printf '#!/bin/bash\nexit 0\n' > kernel/toolchain/clang/host/linux-x86/clang-4639204-cfp-jopp/bin/clang
          chmod +x kernel/toolchain/clang/host/linux-x86/clang-4639204-cfp-jopp/bin/clang
      - name: Build
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          export CC=arm-linux-gnueabihf-gcc
          export HOSTCC="gcc -fcommon"
          cd kernel
          DEF=$(ls arch/arm/configs/ | tail -n 1)
          make $DEF
          echo "CONFIG_ANDROID_BINDERFS=y" >>.config
          echo "CONFIG_SECCOMP=y" >>.config
          make olddefconfig
          make -j1 scripts_basic
          printf '#!/bin/sh\nmkdir -p "$(dirname "$1")"\ntouch "$1"\nexit 0\n' > scripts/basic/fixdep
          chmod +x scripts/basic/fixdep
          mkdir -p scripts/mod
          arm-linux-gnueabihf-gcc -c scripts/mod/empty.c -o scripts/mod/empty.o || echo "manual empty.c fail, creating dummy"
          ls -lh scripts/mod/empty.o || (echo "int x;" | arm-linux-gnueabihf-gcc -c -x c - -o scripts/mod/empty.o; ls -lh scripts/mod/empty.o)
          touch scripts/mod/.empty.o.d
          make -j1 scripts
          make -j1 prepare
          make -j$(nproc) zImage
          ls -lh arch/arm/boot/zImage
      - uses: actions/upload-artifact@v4
        with:
          name: zImage-A960D
          path: kernel/arch/arm/boot/zImage
