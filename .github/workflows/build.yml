name: Build A960D Fast
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
    steps:
      - name: Install deps
        run: |
          apt update -y
          apt install -y git bc bison flex gcc-arm-linux-gnueabihf libssl-dev make
          git config --global --add safe.directory $GITHUB_WORKSPACE
      - uses: actions/checkout@v4
      - name: Clone
        run: |
          rm -rf kernel
          git clone https://github.com/Linux4/samsung_kernel.git --depth=1 kernel
          mkdir -p kernel/toolchain/clang/host/linux-x86/clang-4639204-cfp-jopp/bin
          printf '#!/bin/bash\nexit 0\n' > kernel/toolchain/clang/host/linux-x86/clang-4639204-cfp-jopp/bin/clang
          chmod +x kernel/toolchain/clang/host/linux-x86/clang-4639204-cfp-jopp/bin/clang
      - name: Build
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          export CC=arm-linux-gnueabihf-gcc
          export HOSTCC="gcc -fcommon"
          cd kernel
          DEF=$(ls arch/arm/configs/ | tail -n 1)
          make $DEF
          echo "CONFIG_ANDROID_BINDERFS=y" >>.config
          echo "CONFIG_SECCOMP=y" >>.config
          make olddefconfig
          make -j1 scripts_basic
          # fixdep wrapper
          mv scripts/basic/fixdep scripts/basic/fixdep.real
          printf '#!/bin/sh\nmkdir -p "$(dirname "$1")"\n"'"$(pwd)"'/scripts/basic/fixdep.real" "$@" || (mkdir -p "$(dirname "$1")"; touch "$1"; true)\n' > scripts/basic/fixdep
          chmod +x scripts/basic/fixdep
          # MANUAL empty.o - bypass broken dep
          mkdir -p scripts/mod
          echo "int main(){return 0;}" > scripts/mod/empty.c
          $CC -c scripts/mod/empty.c -o scripts/mod/empty.o || gcc -c scripts/mod/empty.c -o scripts/mod/empty.o
          ls -lh scripts/mod/empty.o
          touch scripts/mod/.empty.o.d
          # build rest
          make -j1 scripts
          make -j1 prepare
          make -j$(nproc) zImage
          ls -lh arch/arm/boot/zImage
      - uses: actions/upload-artifact@v4
        with:
          name: zImage-A960D
          path: kernel/arch/arm/boot/zImage
