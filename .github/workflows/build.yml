name: Build A960D Fast
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
    steps:
      - name: Install deps
        run: |
          apt update -y
          apt install -y git bc bison flex gcc-arm-linux-gnueabihf libssl-dev make
          git config --global --add safe.directory $GITHUB_WORKSPACE
      - uses: actions/checkout@v4
      - name: Clone + fix clang wrapper
        run: |
          rm -rf kernel
          git clone https://github.com/Linux4/samsung_kernel.git --depth=1 kernel
          # bikin clang wrapper yang beneran manggil gcc + handle .d files
          mkdir -p kernel/toolchain/clang/host/linux-x86/clang-4639204-cfp-jopp/bin
          REALGCC=$(which arm-linux-gnueabihf-gcc)
          cat > kernel/toolchain/clang/host/linux-x86/clang-4639204-cfp-jopp/bin/clang << WRAP
          #!/bin/bash
          # wrapper clang -> arm gcc
          for arg in "\$@"; do
            case "\$arg" in
              *","*.d) p=\$(echo "\$arg" | rev | cut -d, -f1 | rev); mkdir -p \$(dirname "\$p") 2>/dev/null; touch "\$p" 2>/dev/null;;
              *.d) mkdir -p \$(dirname "\$arg") 2>/dev/null; touch "\$arg" 2>/dev/null;;
            esac
          done
          exec $REALGCC "\$@"
          WRAP
          chmod +x kernel/toolchain/clang/host/linux-x86/clang-4639204-cfp-jopp/bin/clang
          cat kernel/toolchain/clang/host/linux-x86/clang-4639204-cfp-jopp/bin/clang
      - name: Build
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          export CC=arm-linux-gnueabihf-gcc
          export HOSTCC="gcc -fcommon"
          cd kernel
          DEF=$(ls arch/arm/configs/ | tail -n 1)
          echo "DEF=$DEF"
          make $DEF
          echo "CONFIG_ANDROID_BINDERFS=y" >>.config
          echo "CONFIG_SECCOMP=y" >>.config
          make olddefconfig
          make -j1 scripts_basic
          printf '#!/bin/sh\nmkdir -p "$(dirname "$1")"; touch "$1"; exit 0\n' > scripts/basic/fixdep
          chmod +x scripts/basic/fixdep
          make -j1 scripts
          make -j1 prepare
          make -j$(nproc) zImage
          ls -lh arch/arm/boot/zImage
      - uses: actions/upload-artifact@v4
        with:
          name: zImage-A960D
          path: kernel/arch/arm/boot/zImage
