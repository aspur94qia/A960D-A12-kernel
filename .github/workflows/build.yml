name: Build A960D Fast

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt update -y
          sudo apt install -y bc bison flex gcc-arm-linux-gnueabihf libssl-dev
      - name: Build
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          make sp7731e_1h10_defconfig || make sprd_defconfig || make sp7731e_defconfig
          printf "\nCONFIG_ANDROID_BINDERFS=y\nCONFIG_SECCOMP=y\nCONFIG_SECCOMP_FILTER=y\n" >> .config
          make olddefconfig
          make -j$(nproc) zImage
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: zImage-A960D-A12
          path: arch/arm/boot/zImage
