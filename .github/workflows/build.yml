name: Build A960D Fast
on: workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: sudo apt update -y && sudo apt install -y bc bison flex gcc-arm-linux-gnueabihf
      - name: Build
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          DEF=$(ls arch/arm/configs/ | grep -i 7731 | head -n 1)
          echo "DEFCONFIG=$DEF"
          make $DEF
          echo "CONFIG_ANDROID_BINDERFS=y" >> .config
          echo "CONFIG_SECCOMP=y" >> .config
          echo "CONFIG_SECCOMP_FILTER=y" >> .config
          make olddefconfig
          make -j$(nproc) zImage
      - uses: actions/upload-artifact@v4
        with:
          name: zImage-A960D-A12
          path: arch/arm/boot/zImage
