name: Build A960D Fast
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Clone kernel
        run: |
          rm -rf kernel
          git clone https://github.com/Linux4/samsung_kernel.git --depth=1 kernel
          ls kernel/arch/arm/configs/ | head -n 30
      - name: Install
        run: sudo apt update -y && sudo apt install -y bc bison flex gcc-arm-linux-gnueabihf libssl-dev
      - name: Build
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          cd kernel
          DEF=$(ls arch/arm/configs/ | head -n 1)
          echo "Using $DEF"
          make $DEF
          echo "CONFIG_ANDROID_BINDERFS=y" >> .config
          echo "CONFIG_SECCOMP=y" >> .config
          make olddefconfig
          make -j$(nproc) zImage
          ls -lh arch/arm/boot/
      - uses: actions/upload-artifact@v4
        with:
          name: zImage-A960D
          path: kernel/arch/arm/boot/zImage
