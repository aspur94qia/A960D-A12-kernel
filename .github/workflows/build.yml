name: Build A960D Fast
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
    steps:
      - name: Install deps
        run: |
          apt update -y
          apt install -y git bc bison flex gcc-arm-linux-gnueabihf libssl-dev make
          git config --global --add safe.directory $GITHUB_WORKSPACE
      - uses: actions/checkout@v4
      - name: Clone + patches
        run: |
          rm -rf kernel
          git clone https://github.com/Linux4/samsung_kernel.git --depth=1 kernel
          mkdir -p kernel/toolchain/clang/host/linux-x86/clang-4639204-cfp-jopp/bin
          printf '#!/bin/bash\nREAL=/usr/bin/arm-linux-gnueabihf-gcc\nARGS=()\nSKIP=0\nfor a in "$@"; do if [ $SKIP -eq 1 ]; then SKIP=0; continue; fi; case "$a" in -march=armv8-a+lse|-march=armv8-a) continue;; -Xassembler) SKIP=1; continue;; -no-integrated-as) continue;; --param=allow-store-data-races=0) continue;; esac; if echo "$a" | grep -q "\\.d$"; then p=$(echo "$a" | rev | cut -d, -f1 | rev); mkdir -p "$(dirname "$p")" 2>/dev/null; touch "$p" 2>/dev/null; fi; ARGS+=("$a"); done; exec $REAL "${ARGS[@]}"\n' > kernel/toolchain/clang/host/linux-x86/clang-4639204-cfp-jopp/bin/clang
          chmod +x kernel/toolchain/clang/host/linux-x86/clang-4639204-cfp-jopp/bin/clang
          cd kernel
          sed -i '/#define DEV_SOCDATA_MAGIC/d' include/linux/device.h
          awk 'BEGIN{p=1} /struct dev_socdata \{/{p=0} p; /\};/ && p==0 {p=1; next}' include/linux/device.h > /tmp/fixed.h && mv /tmp/fixed.h include/linux/device.h
          sed -i '1i #ifndef DEV_SOCDATA_MAGIC\n#define DEV_SOCDATA_MAGIC 0xCAFEDEAD\nstruct dev_socdata { int magic; const char *soc; const char *ip; };\n#endif' include/linux/device.h
          sed -i '/sl_softirq_entry/d' include/linux/nmi.h
          sed -i '/sl_hardirq_entry/d' include/linux/nmi.h
          sed -i '/sl_softirq_exit/d' include/linux/nmi.h
          echo "static inline void sl_softirq_entry(const char *a, void *b) { }" >> include/linux/nmi.h
          echo "static inline void sl_hardirq_entry(const char *a, void *b) { }" >> include/linux/nmi.h
          echo "static inline void sl_softirq_exit(void) { }" >> include/linux/nmi.h
          mkdir -p arch/arm/include/asm
          echo "#ifndef __ASM_KERNEL_PGTABLE_H\n#define __ASM_KERNEL_PGTABLE_H\n#endif" > arch/arm/include/asm/kernel-pgtable.h
          sed -i 's/static bool __init_or_module initcall_sec_debug/static bool initcall_sec_debug/' init/main.c
          cat > include/linux/sec_debug.h << 'EOF'
          #ifndef SEC_DEBUG_H
          #define SEC_DEBUG_H
          #define DSS_FLAG_IN 0
          #define DSS_FLAG_OUT 1
          #define DTYPE_CPUHP 0
          #define DTYPE_TASK 0
          #define DTYPE_WORK 0
          #define DTYPE_SOFTIRQ 0
          #define DTYPE_IRQ 0
          struct sec_debug_auto_comment { int dummy; };
          struct sec_debug_auto_comment_info { int dummy; };
          static inline void sec_debug_wtsk_set_data(int a, void *b) {}
          static inline void sec_debug_wtsk_clear_data(void) {}
          static inline void sec_debug_task_set_cpu(int a, int b) {}
          static inline void sec_debug_init(void) {}
          static inline void sec_debug_auto_comment_init(void) {}
          #define sec_debug_auto_comment(a,b) do{}while(0)
          #define SEC_DEBUG_AUTO_COMMENT_MAGIC 0
          #define sched_cpu_rq_online(a) do{}while(0)
          #endif
          EOF
          cat > include/linux/debug-snapshot.h << 'EOF'
          #ifndef DEBUG_SNAPSHOT_H
          #define DEBUG_SNAPSHOT_H
          #define DSS_FLAG_IN 0
          #define DSS_FLAG_OUT 1
          #define DSS_FLAG_TEMP 0
          #define DSS_FLAG_IRQ 0
          #define DSS_FLAG_SOFTIRQ 0
          #define DSS_FLAG_SOFTIRQ_TASKLET 0
          #define DSS_FLAG_SOFTIRQ_HI_TASKLET 0
          #define DSS_FLAG_SOFTIRQ_HI 0
          #define DSS_FLAG_SOFTIRQ_TIMER 0
          #define DSS_FLAG_SOFTIRQ_NET_TX 0
          #define DSS_FLAG_SOFTIRQ_NET_RX 0
          #define DSS_FLAG_SOFTIRQ_BLOCK 0
          #define DSS_FLAG_SOFTIRQ_IRQ_POLL 0
          #define DSS_FLAG_SOFTIRQ_SCHED 0
          #define DSS_FLAG_SOFTIRQ_HRTIMER 0
          #define DSS_FLAG_SOFTIRQ_RCU 0
          #define DSS_FLAG_WORK 0
          #define DSS_FLAG_TASK 0
          #define DSS_FLAG_SUSPEND 0
          #define DSS_FLAG_RESUME 0
          #define DSS_FLAG_CLOCK 0
          /* Brutal macro - accept any args */
          #define dbg_snapshot_suspend(...) do{}while(0)
          #define dbg_snapshot_resume(...) do{}while(0)
          #define dbg_snapshot_task(...) do{}while(0)
          #define dbg_snapshot_spinlock(...) do{}while(0)
          #define dbg_snapshot_mutex(...) do{}while(0)
          #define dbg_snapshot_sema(...) do{}while(0)
          #define dbg_snapshot_irq(...) do{}while(0)
          #define dbg_snapshot_irq_var(...) do{}while(0)
          #define dbg_snapshot_work(...) do{}while(0)
          #define dbg_snapshot_work_not_running(...) do{}while(0)
          #define dbg_snapshot_clock_nanosleep(...) do{}while(0)
          #define dbg_snapshot_hrtimer(...) do{}while(0)
          #define dbg_snapshot_timer(...) do{}while(0)
          #define dbg_snapshot_early_panic(...) do{}while(0)
          #define dbg_snapshot_hook_hardlockup_exit(...) do{}while(0)
          #define dbg_snapshot_prepare_panic(...) do{}while(0)
          #define dbg_snapshot_dump_panic(...) do{}while(0)
          #define dbg_snapshot_post_panic(...) do{}while(0)
          #define dbg_snapshot_print_log(...) do{}while(0)
          #define dbg_snapshot_print_log_task(...) do{}while(0)
          #define dbg_snapshot_print_log_work(...) do{}while(0)
          #define dbg_snapshot_hardirq_enable(...) do{}while(0)
          #define dbg_snapshot_hardirq_disable(...) do{}while(0)
          #define dbg_snapshot_add_bl_item_info(a,b,c) 0
          #endif
          EOF
          sed -i '1i #include <linux/debug-snapshot.h>' include/linux/spinlock_api_smp.h
      - name: Build
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          export CC=arm-linux-gnueabihf-gcc
          export HOSTCC="gcc -fcommon"
          cd kernel
          DEF=$(ls arch/arm/configs/ | tail -n 1)
          make $DEF
          sed -i 's/CONFIG_DEBUG_SNAPSHOT=.*/# CONFIG_DEBUG_SNAPSHOT is not set/' .config
          echo "# CONFIG_DEBUG_SNAPSHOT is not set" >> .config
          echo "CONFIG_ANDROID_BINDERFS=y" >> .config
          echo "CONFIG_SECCOMP=y" >> .config
          make olddefconfig
          make -j1 scripts_basic
          printf '#!/bin/sh\nmkdir -p "$(dirname "$1")"; touch "$1"; exit 0\n' > scripts/basic/fixdep; chmod +x scripts/basic/fixdep
          make -j1 scripts
          make -j1 prepare KCFLAGS="-Wno-error"
          make -j$(nproc) zImage KCFLAGS="-Wno-error" || make -j1 zImage KCFLAGS="-Wno-error"
          ls -lh arch/arm/boot/zImage
      - uses: actions/upload-artifact@v4
        with:
          name: zImage-A960D
          path: kernel/arch/arm/boot/zImage
