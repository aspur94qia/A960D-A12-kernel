name: Build A960D Fast
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
    steps:
      - name: Install deps
        run: |
          apt update -y
          apt install -y git bc bison flex gcc-arm-linux-gnueabihf libssl-dev make
          git config --global --add safe.directory $GITHUB_WORKSPACE
          # WRAP gcc to auto-create depfile dirs
          mv /usr/bin/arm-linux-gnueabihf-gcc /usr/bin/arm-linux-gnueabihf-gcc.real
          printf '#!/bin/bash\nfor arg in "$@"; do case "$arg" in *-MD,*|*MD,* ) f=$(echo "$arg" | sed -e "s/.*-MD,//" -e "s/,.*//" -e "s/.*MD,//"); mkdir -p "$(dirname "$f")" 2>/dev/null; touch "$f" 2>/dev/null;; *.d) mkdir -p "$(dirname "$arg")"; touch "$arg";; esac; done\n# also handle -Wp,-MD,path form\nfor a in "$@"; do if echo "$a" | grep -q "MD,"; then p=$(echo "$a" | cut -d, -f2); mkdir -p "$(dirname "$p")"; fi; done\n/usr/bin/arm-linux-gnueabihf-gcc.real "$@"\n' > /usr/bin/arm-linux-gnueabihf-gcc
          chmod +x /usr/bin/arm-linux-gnueabihf-gcc
      - uses: actions/checkout@v4
      - name: Clone
        run: |
          rm -rf kernel
          git clone https://github.com/Linux4/samsung_kernel.git --depth=1 kernel
          mkdir -p kernel/toolchain/clang/host/linux-x86/clang-4639204-cfp-jopp/bin
          printf '#!/bin/bash\nexit 0\n' > kernel/toolchain/clang/host/linux-x86/clang-4639204-cfp-jopp/bin/clang
          chmod +x kernel/toolchain/clang/host/linux-x86/clang-4639204-cfp-jopp/bin/clang
      - name: Build
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          export CC=arm-linux-gnueabihf-gcc
          export HOSTCC="gcc -fcommon"
          cd kernel
          DEF=$(ls arch/arm/configs/ | tail -n 1)
          make $DEF
          echo "CONFIG_ANDROID_BINDERFS=y" >>.config
          echo "CONFIG_SECCOMP=y" >>.config
          make olddefconfig
          make -j1 scripts_basic
          # Replace fixdep with true no-op
          printf '#!/bin/sh\nDEP="$1"\nmkdir -p "$(dirname "$DEP")"\ntouch "$DEP"\nexit 0\n' > scripts/basic/fixdep
          chmod +x scripts/basic/fixdep
          make -j1 scripts
          make -j1 prepare
          make -j$(nproc) zImage
          ls -lh arch/arm/boot/zImage
      - uses: actions/upload-artifact@v4
        with:
          name: zImage-A960D
          path: kernel/arch/arm/boot/zImage
